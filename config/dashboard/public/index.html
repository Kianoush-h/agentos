<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOS Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0c29;
    --surface:   #1a1740;
    --surface2:  #231f52;
    --border:    #302b63;
    --text:      #e0e0e0;
    --muted:     #888;
    --accent:    #7c6cff;
    --green:     #3ecf8e;
    --red:       #f87171;
    --yellow:    #fbbf24;
    --radius:    8px;
    --font:      'Segoe UI', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Layout ─────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 260px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  header .logo {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #fff;
  }

  header .logo span { color: var(--accent); }

  header .agent-name {
    font-size: 13px;
    color: var(--muted);
    margin-left: 4px;
  }

  header .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.green  { background: var(--green);  box-shadow: 0 0 6px var(--green); }
  .dot.red    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

  /* ── Sidebar ─────────────────────────────────────────── */
  aside {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .service-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius);
    background: var(--surface2);
    margin-bottom: 6px;
    font-size: 13px;
  }

  .service-name { flex: 1; }
  .service-state {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--border);
    color: var(--muted);
  }
  .service-state.active   { background: rgba(62,207,142,.15); color: var(--green); }
  .service-state.inactive { background: rgba(248,113,113,.15); color: var(--red); }

  .meta-row {
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
    display: flex;
    justify-content: space-between;
  }
  .meta-row span:last-child { color: var(--text); font-family: monospace; }

  /* ── Main area ───────────────────────────────────────── */
  main {
    grid-area: main;
    display: grid;
    grid-template-rows: 1fr 220px;
    overflow: hidden;
  }

  /* ── Chat pane ───────────────────────────────────────── */
  .chat-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .pane-header {
    padding: 12px 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 840px;
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .avatar.user  { background: var(--accent); }
  .avatar.agent { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 680px;
  }
  .message.user  .bubble { background: var(--accent); color: #fff; border-radius: var(--radius) 2px var(--radius) var(--radius); }
  .message.agent .bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 2px var(--radius) var(--radius) var(--radius); }

  .typing-indicator span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* ── Input bar ───────────────────────────────────────── */
  .input-bar {
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 10px 14px;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  button {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    height: 42px;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  button:hover   { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Log pane ────────────────────────────────────────── */
  .log-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .log-pane .pane-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .refresh-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 10px;
    height: auto;
    border-radius: 4px;
    font-weight: 400;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); opacity: 1; }

  .log-output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 20px;
    font-family: 'Consolas', 'Fira Mono', monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #a0a0c0;
  }

  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line.err  { color: var(--red); }
  .log-line.warn { color: var(--yellow); }

  /* ── Scrollbar ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Header -->
  <header>
    <div class="logo">Agent<span>OS</span></div>
    <div class="agent-name" id="agentName">Dashboard</div>
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">checking...</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside>
    <div>
      <div class="section-label">Services</div>
      <div class="service-row">
        <div class="dot" id="gatewayDot"></div>
        <div class="service-name">agentos-gateway</div>
        <div class="service-state" id="gatewayState">—</div>
      </div>
      <div class="service-row">
        <div class="dot" id="brokerDot"></div>
        <div class="service-name">agentos-broker</div>
        <div class="service-state" id="brokerState">—</div>
      </div>
    </div>

    <div>
      <div class="section-label">Info</div>
      <div class="meta-row"><span>Claude version</span><span id="claudeVersion">—</span></div>
      <div class="meta-row"><span>Uptime</span><span id="uptime">—</span></div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <!-- Chat -->
    <div class="chat-pane">
      <div class="pane-header">Chat</div>
      <div class="messages" id="messages">
        <div class="empty-state">Send a message to start chatting with your agent.</div>
      </div>
      <div class="input-bar">
        <textarea id="promptInput" placeholder="Ask your agent anything..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Logs -->
    <div class="log-pane">
      <div class="pane-header">
        Service Logs
        <button class="refresh-btn" id="refreshLogs">Refresh</button>
      </div>
      <div class="log-output" id="logOutput">
        <div class="empty-state">Loading logs...</div>
      </div>
    </div>
  </main>

</div>

<script>
// ── Utilities ──────────────────────────────────────────────────────

function el(id) { return document.getElementById(id); }

function fmtUptime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
}

function setServiceDot(dotEl, stateEl, state) {
    const active = state === 'active';
    const inactive = state === 'inactive' || state === 'failed';
    dotEl.className = 'dot ' + (active ? 'green' : inactive ? 'red' : 'yellow');
    stateEl.textContent = state || '—';
    stateEl.className = 'service-state ' + (active ? 'active' : inactive ? 'inactive' : '');
}

// ── Status polling ─────────────────────────────────────────────────

async function fetchStatus() {
    try {
        const r = await fetch('/api/status');
        const d = await r.json();

        el('agentName').textContent = d.agent_name || 'Atlas';
        el('claudeVersion').textContent = d.claude_version || '—';
        el('uptime').textContent = fmtUptime(d.uptime || 0);

        const gw = d.services?.gateway || 'unknown';
        const bk = d.services?.broker  || 'unknown';
        setServiceDot(el('gatewayDot'), el('gatewayState'), gw);
        setServiceDot(el('brokerDot'),  el('brokerState'),  bk);

        const allOk = gw === 'active' && bk === 'active';
        el('statusDot').className  = 'dot ' + (allOk ? 'green' : 'yellow');
        el('statusText').textContent = allOk ? 'running' : 'degraded';
    } catch {
        el('statusDot').className  = 'dot red';
        el('statusText').textContent = 'offline';
    }
}

// ── Logs ────────────────────────────────────────────────────────────

async function fetchLogs() {
    const out = el('logOutput');
    try {
        const r = await fetch('/api/logs');
        const d = await r.json();
        const lines = d.lines || [];
        if (!lines.length) {
            out.innerHTML = '<div class="empty-state">No log entries yet.</div>';
            return;
        }
        out.innerHTML = lines.map(line => {
            const cls = /error|fail|crit/i.test(line) ? 'err'
                      : /warn/i.test(line) ? 'warn' : '';
            return `<div class="log-line ${cls}">${escHtml(line)}</div>`;
        }).join('');
        out.scrollTop = out.scrollHeight;
    } catch {
        out.innerHTML = '<div class="empty-state">Could not load logs.</div>';
    }
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Chat ────────────────────────────────────────────────────────────

function appendMessage(role, text) {
    const msgs = el('messages');

    // Remove empty state
    const empty = msgs.querySelector('.empty-state');
    if (empty) empty.remove();

    const isUser = role === 'user';
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.innerHTML = `
        <div class="avatar ${role}">${isUser ? 'Y' : 'A'}</div>
        <div class="bubble">${escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.bubble');
}

function showTyping() {
    const msgs = el('messages');
    const div = document.createElement('div');
    div.className = 'message agent';
    div.id = 'typingIndicator';
    div.innerHTML = `
        <div class="avatar agent">A</div>
        <div class="bubble typing-indicator">
            <span></span><span></span><span></span>
        </div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

async function sendMessage() {
    const input = el('promptInput');
    const btn   = el('sendBtn');
    const prompt = input.value.trim();
    if (!prompt) return;

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    appendMessage('user', prompt);
    const typing = showTyping();

    let agentBubble = null;
    let fullText = '';

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop();

            for (const part of parts) {
                const line = part.replace(/^data: /, '').trim();
                if (!line) continue;
                try {
                    const chunk = JSON.parse(line);
                    if (chunk.text) {
                        fullText += chunk.text;
                        if (!agentBubble) {
                            typing.remove();
                            agentBubble = appendMessage('agent', fullText);
                        } else {
                            agentBubble.textContent = fullText;
                            el('messages').scrollTop = el('messages').scrollHeight;
                        }
                    }
                    if (chunk.done) break;
                } catch { /* partial JSON, skip */ }
            }
        }
    } catch (err) {
        typing.remove();
        appendMessage('agent', 'Error: could not reach agent. Is agentos-gateway running?');
    }

    if (!agentBubble) typing.remove();
    btn.disabled = false;
    input.focus();
}

// ── Event listeners ────────────────────────────────────────────────

el('sendBtn').addEventListener('click', sendMessage);

el('promptInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

el('promptInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

el('refreshLogs').addEventListener('click', fetchLogs);

// ── Init ───────────────────────────────────────────────────────────

fetchStatus();
fetchLogs();
setInterval(fetchStatus, 10000);
setInterval(fetchLogs,   30000);
</script>
</body>
</html>
